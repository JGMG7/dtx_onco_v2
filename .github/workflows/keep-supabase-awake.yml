name: Keep Supabase Awake

on:
  schedule:
    # Todos los días a las 12:00 UTC. Suficiente para evitar la pausa por
    # inactividad (~7 días sin uso) del plan gratuito de Supabase.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/"
